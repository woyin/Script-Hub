<!doctype html>
<!-- Interface adapted from Sub-Store Front-End (GPL-3.0). See UI-NOTICE.md. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Sub-Store · 订阅与文件管理</title>
    <style>
      /* MANAGEMENT_CSS */
    </style>
  </head>
  <body>
    <!-- MANAGEMENT_ICONS -->
    <header class="navbar container">
      <div class="nav-actions left" id="navLeft"></div>
      <h1 id="pageTitle">订阅</h1>
      <div class="nav-actions right" id="navRight"></div>
    </header>
    <nav class="sidebar" aria-label="主导航" id="sidebar"></nav>
    <main class="page container" id="page" aria-label="订阅与文件管理"></main>
    <nav
      class="bottom-nav container"
      aria-label="底部导航"
      id="bottomNav"
    ></nav>
    <dialog class="modal sheet" id="actionDialog" aria-labelledby="dialogTitle">
      <div class="modal-header">
        <h2 id="dialogTitle"></h2>
        <button class="icon-button" id="closeDialog" aria-label="关闭弹窗">
          <svg class="icon"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="modal-body" id="dialogBody"></div>
    </dialog>
    <dialog class="modal" id="confirmDialog" aria-labelledby="confirmTitle">
      <div class="modal-header"><h2 id="confirmTitle">确认操作</h2></div>
      <div class="modal-body">
        <p class="confirm-message" id="confirmMessage"></p>
        <div class="modal-actions">
          <button class="plain-button" id="confirmCancel">取消</button
          ><button class="primary-button" id="confirmOK">确认</button>
        </div>
      </div>
    </dialog>
    <div
      class="toast hidden"
      id="message"
      role="status"
      aria-live="polite"
    ></div>
    <script>
      /* MANAGEMENT_JS */
    </script>
  </body>
</html>
