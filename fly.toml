app = "breestealth-scripthub-go"
primary_region = "sin"

[env]
  CACHE_DIR = "/data/cache"
  CACHE_TTL_SECONDS = "86400"
  CACHE_MAX_BYTES = "838860800"
  MAX_CONCURRENT_CONVERSIONS = "2"
  REFRESH_JOBS_FILE = "/config/refresh-jobs.json"
  REFRESH_STATUS_FILE = "/data/refresh-status.json"
  REFRESH_COOLDOWN_SECONDS = "60"
  REFRESH_MAX_PER_MINUTE = "10"

[[mounts]]
  source = "scripthub_cache"
  destination = "/data"
  initial_size = "1gb"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 9100
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
